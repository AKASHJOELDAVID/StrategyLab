name: Apply overview mobile typography

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-styles:
    if: github.event.issue.title == '[automation] Apply overview mobile typography'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add mobile overview typography
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('css/styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Strategy Lab overview mobile typography */'
          block = '''
/* Strategy Lab overview mobile typography */
@media (max-width: 520px) {
  #page-rc-main .overview-section h2 {
    font-size: 20px;
    line-height: 1.3;
    letter-spacing: .08em;
    margin-bottom: 12px;
  }

  #page-rc-main .overview-section p {
    font-size: 17px;
    line-height: 1.65;
  }
}
'''

          if marker not in css:
              css = css.rstrip() + '\n\n' + block.strip() + '\n'
              css_path.write_text(css, encoding='utf-8')

          workflow = Path('.github/workflows/apply-overview-mobile-typography.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit typography update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/styles.css .github/workflows/apply-overview-mobile-typography.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Improve Reading overview mobile typography"
          git push origin HEAD:main
