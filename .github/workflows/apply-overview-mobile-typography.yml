name: Apply overview mobile typography

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch-styles:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'apply-overview-mobile-typography')
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add mobile overview typography
        shell: python
        run: |
          from pathlib import Path
          css_path = Path('css/styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Strategy Lab overview mobile typography */'
          block = '''
/* Strategy Lab overview mobile typography */
@media (max-width: 520px) {
  #page-rc-main .overview-section h2 {
    font-size: 20px;
    line-height: 1.3;
    letter-spacing: .08em;
    margin-bottom: 12px;
  }

  #page-rc-main .overview-section p {
    font-size: 17px;
    line-height: 1.65;
  }
}
'''
          if marker not in css:
              css = css.rstrip() + '\n\n' + block.strip() + '\n'
              css_path.write_text(css, encoding='utf-8')

      - name: Commit typography update to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/styles.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Improve Reading overview mobile typography"
          git push origin HEAD:${{ github.head_ref }}
